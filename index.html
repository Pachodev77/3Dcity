<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Plan with Avatars</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #avatar-selector-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
        }

        #joystick-container-move {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 100px;
        }

        #joystick-container-camera {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
        }

        #spawn-vehicle-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 12px;
            background-color: rgba(52, 152, 219, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            z-index: 100;
            transition: background-color 0.3s;
        }

        #spawn-vehicle-button:hover {
            background-color: rgba(41, 128, 185, 0.9);
        }

        #enter-exit-button {
            position: absolute;
            bottom: 140px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: rgba(76, 175, 80, 0.7);
            border-radius: 50%;
            display: none;
            /* Initially hidden */
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-weight: bold;
            z-index: 101;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #zoom-slider {
            position: absolute;
            right: 10px;
            top: 50%;
            width: 150px;
            height: 20px;
            transform-origin: center;
            transform: translateY(-50%) rotate(-90deg);
            z-index: 101;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.5);
            outline: none;
            border-radius: 10px;
        }

        #zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            background: rgba(76, 175, 80, 0.8);
            cursor: pointer;
            border-radius: 50%;
        }

        #zoom-slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            background: rgba(76, 175, 80, 0.8);
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>

<body>
    <div id="avatar-selector-container">
        <label for="avatar-selector">Choose an avatar:</label>
        <select id="avatar-selector"></select>
    </div>

    <div id="map-selector-container" style="position: absolute; top: 40px; left: 10px; z-index: 100;">
        <button id="home-button">🏠</button>
        <button id="city-button">🏙️</button>
        <button id="spawn-vehicle-button">Spawn Vehicle</button>
        <button id="circuit-button">🏁</button>
    </div>

    <div id="joystick-container-move"></div>
    <div id="joystick-container-camera"></div>
    <div id="enter-exit-button">E</div>
    <input type="range" min="1" max="7" value="4" id="zoom-slider">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.138.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.138.0/examples/jsm/"
            }
        }
    </script>
    <script src="/cache.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
